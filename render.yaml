# Blueprint de Render: UN solo servicio (monolito) sirve API .NET + frontend compilado.
# Mismo origen => sin CORS, una sola URL.
services:
  - type: web
    name: requirements-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/analyses
    envVars:
      # Demo sin credenciales: agentes con datos de ejemplo, historial en memoria.
      # Para IA real: Providers__Chat=Foundry + Foundry__* ; Providers__AnalysisRepository=Mongo + Mongo__*.
      - key: Providers__Chat
        value: Fake
      - key: Providers__AnalysisRepository
        value: InMemory
